name: CD - Deploy Stock Diary Container

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Server Environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
  workflow_call: {}

env:
  REGISTRY: docker.io
  IMAGE_NAME: stock-diary

jobs:
  deploy-dev:
    if: github.event.inputs.environment == 'dev'
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_ID }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PW }}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=stock-diary-dev" >> $GITHUB_ENV
          echo "DEPLOY_PORT=8080" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "TARGET_IMAGE=${{ env.REGISTRY }}/${{ secrets.DOCKER_ID }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Get EC2 deployment parameters from SSM
        uses: dkershner6/aws-ssm-getparameters-action@v2.0.3
        id: ssm
        with:
          parameterPairs: |
            /ci/ec2/host = EC2_HOST,
            /ci/ec2/user = EC2_USER,
            /ci/ec2/private_key = EC2_PRIVATE_KEY,
            /ci/ec2/ssh_port = EC2_SSH_PORT,
            spring.datasource.url = DB_URL,
            spring.datasource.username = DB_USERNAME,
            spring.datasource.password = DB_PASSWORD
          withDecryption: "true"

      - name: Deploy to development environment
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_PRIVATE_KEY }}
          port: ${{ env.EC2_SSH_PORT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,CONTAINER_NAME,DEPLOY_PORT,TARGET_IMAGE,DB_URL,DB_USERNAME,DB_PASSWORD
          script: |
            echo "🚀 Starting container deployment to development..."

            # Login to Docker Hub
            echo "🔐 Logging into Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

            # Pull Docker image
            echo "📥 Pulling Docker image: $TARGET_IMAGE"
            docker pull "$TARGET_IMAGE"

            # Stop and remove existing container
            echo "⏹️ Stopping existing container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            # Start new container
            echo "🚀 Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$DEPLOY_PORT":8080 \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$TARGET_IMAGE"

            echo "✅ Development container started successfully"
            docker ps --filter "name=$CONTAINER_NAME"

            # Wait for application to start
            echo "⏳ Waiting for application to start..."
            sleep 15

            # Check if container is running
            if docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" | grep -q $CONTAINER_NAME; then
              echo "✅ Development container is running successfully"

              # Show container logs
              echo "📋 Container logs (last 10 lines):"
              docker logs --tail 10 "$CONTAINER_NAME"
            else
              echo "❌ Development container failed to start"
              echo "📋 Container logs:"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            # Clean up old Docker images
            echo "🧹 Cleaning up old Docker images..."

            # Get current image ID
            CURRENT_IMAGE_ID=$(docker images "$TARGET_IMAGE" --format "{{.ID}}" | head -n 1)
            echo "Current image ID: $CURRENT_IMAGE_ID"

            # Get all images for this repository (excluding the current one)
            OLD_IMAGES=$(docker images "$REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME" --format "{{.ID}} {{.Tag}}" | grep -v "$CURRENT_IMAGE_ID" | head -n -1 | awk '{print $1}')

            if [ -n "$OLD_IMAGES" ]; then
              echo "Removing old images (keeping 1 backup):"
              echo "$OLD_IMAGES"
              echo "$OLD_IMAGES" | xargs -r docker rmi -f || true
            else
              echo "No old images to clean up"
            fi

            # Clean up dangling images
            echo "Cleaning up dangling images..."
            docker image prune -f || true

            echo "🎉 Development deployment completed successfully!"
            echo "🌐 Access URL: http://localhost:$DEPLOY_PORT"

  deploy-prod:
    if: github.event.inputs.environment == 'prod'
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_ID }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PW }}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=stock-diary-prod" >> $GITHUB_ENV
          echo "DEPLOY_PORT=8080" >> $GITHUB_ENV
          echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
          echo "TARGET_IMAGE=${{ env.REGISTRY }}/${{ secrets.DOCKER_ID }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Get EC2 deployment parameters from SSM
        uses: dkershner6/aws-ssm-getparameters-action@v2.0.3
        id: ssm
        with:
          parameterPairs: |
            /ci/ec2/host = EC2_HOST,
            /ci/ec2/user = EC2_USER,
            /ci/ec2/private_key = EC2_PRIVATE_KEY,
            /ci/ec2/ssh_port = EC2_SSH_PORT,
            spring.datasource.url = DB_URL,
            spring.datasource.username = DB_USERNAME,
            spring.datasource.password = DB_PASSWORD
          withDecryption: "true"

      - name: Deploy to production environment
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_PRIVATE_KEY }}
          port: ${{ env.EC2_SSH_PORT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,CONTAINER_NAME,DEPLOY_PORT,TARGET_IMAGE,DB_URL,DB_USERNAME,DB_PASSWORD
          script: |
            echo "🚀 Starting container deployment to production..."

            # Login to Docker Hub
            echo "🔐 Logging into Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

            # Pull Docker image
            echo "📥 Pulling Docker image: $TARGET_IMAGE"
            docker pull "$TARGET_IMAGE"

            # Stop and remove existing container
            echo "⏹️ Stopping existing container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            # Start new container
            echo "🚀 Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$DEPLOY_PORT":8080 \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$TARGET_IMAGE"

            echo "✅ Production container started successfully"
            docker ps --filter "name=$CONTAINER_NAME"

            # Wait for application to start
            echo "⏳ Waiting for application to start..."
            sleep 15

            # Check if container is running
            if docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" | grep -q $CONTAINER_NAME; then
              echo "✅ Production container is running successfully"

              # Show container logs
              echo "📋 Container logs (last 10 lines):"
              docker logs --tail 10 "$CONTAINER_NAME"
            else
              echo "❌ Production container failed to start"
              echo "📋 Container logs:"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            # Clean up old Docker images
            echo "🧹 Cleaning up old Docker images..."

            # Get current image ID
            CURRENT_IMAGE_ID=$(docker images "$TARGET_IMAGE" --format "{{.ID}}" | head -n 1)
            echo "Current image ID: $CURRENT_IMAGE_ID"

            # Get all images for this repository (excluding the current one)
            OLD_IMAGES=$(docker images "$REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME" --format "{{.ID}} {{.Tag}}" | grep -v "$CURRENT_IMAGE_ID" | head -n -1 | awk '{print $1}')

            if [ -n "$OLD_IMAGES" ]; then
              echo "Removing old images (keeping 1 backup):"
              echo "$OLD_IMAGES"
              echo "$OLD_IMAGES" | xargs -r docker rmi -f || true
            else
              echo "No old images to clean up"
            fi

            # Clean up dangling images
            echo "Cleaning up dangling images..."
            docker image prune -f || true

            echo "🎉 Production deployment completed successfully!"
            echo "🌐 Access URL: http://localhost:$DEPLOY_PORT"