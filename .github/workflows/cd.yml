name: CD - Deploy Stock Diary Container

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Server Environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
  workflow_call: {}

env:
  REGISTRY: docker.io
  IMAGE_NAME: stock-diary

jobs:
  deploy-dev:
    if: github.event.inputs.environment == 'dev'
    name: Deploy to Development
    runs-on: homeserver_depromeet
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_ID }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PW }}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=stock-diary-dev" >> $GITHUB_ENV
          echo "DEPLOY_PORT=${{ vars.DEPLOY_PORT }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev-latest" >> $GITHUB_ENV
          echo "TARGET_IMAGE=${{ env.REGISTRY }}/${{ secrets.DOCKER_ID }}/${{ env.IMAGE_NAME }}:dev-latest" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ vars.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_URL=${{ vars.DB_URL }}" >> $GITHUB_ENV
          echo "DB_USERNAME=${{ vars.DB_USERNAME }}" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=${{ vars.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "STORAGE_ENDPOINT=${{ vars.STORAGE_ENDPOINT }}" >> $GITHUB_ENV
          echo "STORAGE_ACCESS_KEY=${{ vars.STORAGE_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "STORAGE_SECRET_KEY=${{ vars.STORAGE_SECRET_KEY }}" >> $GITHUB_ENV
          echo "KAKAO_ADMIN_KEY=${{ vars.KAKAO_ADMIN_KEY }}" >> $GITHUB_ENV
          echo "KAKAO_CLIENT_ID=${{ vars.KAKAO_CLIENT_ID }}" >> $GITHUB_ENV
          echo "KAKAO_REDIRECT_URI=${{ vars.KAKAO_REDIRECT_URI }}" >> $GITHUB_ENV

      - name: Verify deployment
        run: |
          echo "🚀 Starting container deployment to development..."
          
          # Login to Docker Hub
          echo "🔐 Logging into Docker Hub..."
          echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin
          
          # Pull Docker image
          echo "📥 Pulling Docker image: $TARGET_IMAGE"
          docker pull "$TARGET_IMAGE"
          
          # Stop and remove existing container
          echo "⏹️ Stopping existing container..."
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true
          
          # Start new container
          echo "🚀 Starting new container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$DEPLOY_PORT":8080 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e STORAGE_ENDPOINT="$STORAGE_ENDPOINT" \
            -e STORAGE_ACCESS_KEY="$STORAGE_ACCESS_KEY" \
            -e STORAGE_SECRET_KEY="$STORAGE_SECRET_KEY" \
            -e KAKAO_ADMIN_KEY="$KAKAO_ADMIN_KEY" \
            -e KAKAO_CLIENT_ID="$KAKAO_CLIENT_ID" \
            -e KAKAO_REDIRECT_URI="$KAKAO_REDIRECT_URI" \
            "$TARGET_IMAGE"

          echo "✅ Development container started successfully"
          docker ps --filter "name=$CONTAINER_NAME"

          # Wait for application to start
          echo "⏳ Waiting for application to start..."
          sleep 15

          # Check if container is running
          if docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" | grep -q $CONTAINER_NAME; then
            echo "✅ Development container is running successfully"

            # Show container logs
            echo "📋 Container logs (last 10 lines):"
            docker logs --tail 10 "$CONTAINER_NAME"
          else
            echo "❌ Development container failed to start"
            echo "📋 Container logs:"
            docker logs "$CONTAINER_NAME"
            exit 1
          fi

          # Clean up old Docker images (keep only current)
          echo "🧹 Cleaning up old Docker images..."

          # Get current running container's image ID
          CURRENT_IMAGE_ID=$(docker inspect "$CONTAINER_NAME" --format='{{.Image}}' 2>/dev/null || echo "")

          if [ -n "$CURRENT_IMAGE_ID" ]; then
            echo "Current container image ID: $CURRENT_IMAGE_ID"

            # Remove all juni416/stock-diary images except the current one
            OLD_IMAGES=$(docker images juni416/stock-diary --format "{{.ID}}" | grep -v "$CURRENT_IMAGE_ID" || echo "")

            if [ -n "$OLD_IMAGES" ]; then
              echo "Removing old images (keeping only current):"
              echo "$OLD_IMAGES"
              echo "$OLD_IMAGES" | xargs -r docker rmi -f || true
            else
              echo "No old images to clean up"
            fi
          else
            echo "⚠️ Could not get current container image ID"
          fi

          # Clean up dangling images
          echo "Cleaning up dangling images..."
          docker image prune -f || true

          echo "🎉 Development deployment completed successfully!"
          echo "🌐 Access URL: http://localhost:$DEPLOY_PORT"

  deploy-prod:
    if: github.event.inputs.environment == 'prod'
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_ID }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PW }}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=stock-diary-prod" >> $GITHUB_ENV
          echo "DEPLOY_PORT=8080" >> $GITHUB_ENV
          echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
          echo "TARGET_IMAGE=${{ env.REGISTRY }}/${{ secrets.DOCKER_ID }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Get EC2 deployment parameters from SSM
        uses: dkershner6/aws-ssm-getparameters-action@v2.0.3
        id: ssm
        with:
          parameterPairs: |
            /ci/ec2/host = EC2_HOST,
            /ci/ec2/user = EC2_USER,
            /ci/ec2/private_key = EC2_PRIVATE_KEY,
            /ci/ec2/ssh_port = EC2_SSH_PORT,
            spring.datasource.url = DB_URL,
            spring.datasource.username = DB_USERNAME,
            spring.datasource.password = DB_PASSWORD,
            openai.api.key = OPENAI_API_KEY,
            storage.endpoint = STORAGE_ENDPOINT,
            storage.access.key = STORAGE_ACCESS_KEY,
            storage.secret.key = STORAGE_SECRET_KEY
          withDecryption: "true"

      - name: Deploy to production environment
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_PRIVATE_KEY }}
          port: ${{ env.EC2_SSH_PORT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,CONTAINER_NAME,DEPLOY_PORT,TARGET_IMAGE,DB_URL,DB_USERNAME,DB_PASSWORD,OPENAI_API_KEY,STORAGE_ENDPOINT,STORAGE_ACCESS_KEY,STORAGE_SECRET_KEY
          script: |
            echo "🚀 Starting container deployment to production..."

            # Login to Docker Hub
            echo "🔐 Logging into Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

            # Pull Docker image
            echo "📥 Pulling Docker image: $TARGET_IMAGE"
            docker pull "$TARGET_IMAGE"

            # Stop and remove existing container
            echo "⏹️ Stopping existing container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            # Start new container
            echo "🚀 Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$DEPLOY_PORT":8080 \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e STORAGE_ENDPOINT="$STORAGE_ENDPOINT" \
              -e STORAGE_ACCESS_KEY="$STORAGE_ACCESS_KEY" \
              -e STORAGE_SECRET_KEY="$STORAGE_SECRET_KEY" \
              "$TARGET_IMAGE"

            echo "✅ Production container started successfully"
            docker ps --filter "name=$CONTAINER_NAME"

            # Wait for application to start
            echo "⏳ Waiting for application to start..."
            sleep 15

            # Check if container is running
            if docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" | grep -q $CONTAINER_NAME; then
              echo "✅ Production container is running successfully"

              # Show container logs
              echo "📋 Container logs (last 10 lines):"
              docker logs --tail 10 "$CONTAINER_NAME"
            else
              echo "❌ Production container failed to start"
              echo "📋 Container logs:"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            # Clean up old Docker images (keep only current)
            echo "🧹 Cleaning up old Docker images..."

            # Get current running container's image ID
            CURRENT_IMAGE_ID=$(docker inspect "$CONTAINER_NAME" --format='{{.Image}}' 2>/dev/null || echo "")

            if [ -n "$CURRENT_IMAGE_ID" ]; then
              echo "Current container image ID: $CURRENT_IMAGE_ID"

              # Remove all juni416/stock-diary images except the current one
              OLD_IMAGES=$(docker images juni416/stock-diary --format "{{.ID}}" | grep -v "$CURRENT_IMAGE_ID" || echo "")

              if [ -n "$OLD_IMAGES" ]; then
                echo "Removing old images (keeping only current):"
                echo "$OLD_IMAGES"
                echo "$OLD_IMAGES" | xargs -r docker rmi -f || true
              else
                echo "No old images to clean up"
              fi
            else
              echo "⚠️ Could not get current container image ID"
            fi

            # Clean up dangling images
            echo "Cleaning up dangling images..."
            docker image prune -f || true

            echo "🎉 Production deployment completed successfully!"
            echo "🌐 Access URL: http://localhost:$DEPLOY_PORT"