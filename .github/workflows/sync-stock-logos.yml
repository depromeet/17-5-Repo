# Stock Logo 동기화 Workflow
#
# 용도:
#   MinIO 스토리지의 stock/logo/{code}/{filename} 구조의 파일들을
#   DB의 Stock 테이블 logo 필드에 동기화합니다.
#
# 사용 방법:
#   1. GitHub 리포지토리 → Actions 탭
#   2. 좌측에서 "주식로고를 스토리지기반 DB 업데이트" 선택
#   3. 우측 상단 "Run workflow" 버튼 클릭
#   4. days 값 입력 (필수):
#      - 0: 오늘 올린 파일만 동기화
#      - 7: 최근 7일 이내 파일 동기화 [권장, 기본값]
#      - 30: 최근 30일 이내 파일 동기화
#      - 99999: 사실상 전체 스캔 (모든 파일)
#   5. "Run workflow" 버튼 클릭
#
# 주의사항:
#   - 운영 DB에 직접 업데이트하므로 신중하게 실행
#   - days 값이 클수록 처리 시간이 오래 걸림
#   - 배치는 독립적으로 실행되며 운영 서버에 영향 없음 (batch profile 분리)
#
# 필요한 GitHub Secrets:
#   - DB_URL: 데이터베이스 연결 URL
#   - DB_USERNAME: 데이터베이스 사용자명
#   - DB_PASSWORD: 데이터베이스 비밀번호
#   - STORAGE_ENDPOINT: MinIO/S3 엔드포인트
#   - STORAGE_ACCESS_KEY: 스토리지 액세스 키
#   - STORAGE_SECRET_KEY: 스토리지 시크릿 키
#   - STORAGE_REGION: 스토리지 리전 (기본값: us-east-1)
#   - STORAGE_BUCKET: 스토리지 버킷명 (기본값: depromeet)

name: 주식로고를 스토리지기반 DB 업데이트

on:
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠 이내 파일을 동기화할지 (0=오늘만, 7=권장, 99999=전체)'
        required: true
        type: number
        default: 7

jobs:
  sync-logos:
    name: Sync Stock Logos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run Stock Logo Sync Batch
        run: |
          cd stock-diary
          DAYS="${{ github.event.inputs.days }}"

          echo "========================================="
          echo "🚀 Stock Logo 동기화 배치 시작"
          echo "========================================="
          echo "Days 파라미터: $DAYS"
          if [ "$DAYS" -eq 0 ]; then
            echo "모드: 오늘 올린 파일만 동기화"
          elif [ "$DAYS" -le 7 ]; then
            echo "모드: 최근 ${DAYS}일 이내 파일 동기화"
          elif [ "$DAYS" -ge 99999 ]; then
            echo "모드: 전체 스캔 (모든 파일)"
          else
            echo "모드: 최근 ${DAYS}일 이내 파일 동기화"
          fi
          echo "========================================="

          ../gradlew bootRun --args='--spring.profiles.active=batch' \
            -Dbatch.stock-logo-update.days=$DAYS
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}

      - name: Check batch result
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Stock logo sync completed successfully"
          else
            echo "❌ Stock logo sync failed"
            exit 1
          fi
